model:
  name: openai/whisper-large-v3
  load_in_8bit: true
  torch_dtype: float16
  device_map: cuda:0
lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
  - q_proj
  - v_proj
  bias: none
training:
  batch_size: 1
  gradient_accumulation_steps: 8
  max_steps: 5000
  warmup_steps: 200
  learning_rate: 0.0001
  lr_scheduler: cosine
  fp16: true
  eval_steps: 250
  save_steps: 250
  save_total_limit: 2
  dataloader_num_workers: 2
  pin_memory: false
  language: te
  task: transcribe
  generation_max_length: 225
augmentation:
  spec_augment:
    time_masks: 2
    time_mask_max: 50
    freq_masks: 2
    freq_mask_max: 20
    apply_prob: 0.8
  speed_perturbation:
  - 0.9
  - 1.0
  - 1.1
  noise:
    snr_range:
    - 15
    - 25
    apply_prob: 0.3
target_metrics:
  wer: 0.2
  cer: 0.1
